<script>

  "#6b69d6", // 原色
  "#df7988",
  "#0177b8",
  "#8ea885",
  "#ffb900",
  "#c475b9",
  "#d480c1"
];
// 随机取色
const labels = document.querySelectorAll(".flbj");
// 应用到标签

});
