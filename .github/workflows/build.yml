# GitHub Actions build on push



name: Build Plugin



on: workflow_dispatch



jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4

        with:

          node-version: 20

      - uses: pnpm/action-setup@v4

        with:

          version: 9

      - uses: actions/setup-java@v4

        with:

          distribution: temurin

          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build UI

        working-directory: ui

        run: |

          pnpm install

          pnpm build

      - name: Build plugin

        run: gradle build -x test

      - name: Verify console UI in jar

        run: |

          JAR=$(ls build/libs/*.jar | grep -v plain | head -1)

          echo "Verifying $JAR"

          unzip -l "$JAR" | grep -E 'console/|ui/'

          unzip -l "$JAR" | grep -q 'console/main.js'

          unzip -l "$JAR" | grep -q 'console/style.css'

          unzip -p "$JAR" console/main.js | grep -q 'plugin:self:tabs:create'

          unzip -p "$JAR" console/main.js | grep -q 'xlingran-shan'

          SIZE=$(unzip -p "$JAR" console/main.js | wc -c)

          test "$SIZE" -gt 1024

      - name: Upload plugin jar

        uses: actions/upload-artifact@v4

        with:

          name: xlingran-shan-plugin

          path: |

            build/libs/*.jar

            !build/libs/*-plain.jar

          if-no-files-found: error

          retention-days: 30


